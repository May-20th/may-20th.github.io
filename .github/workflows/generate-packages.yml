name: Update Repo Packages
on:
  push:
    paths:
      - 'debs/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev zstd
      - name: Fix deb permissions
        run: |
          sudo chmod -R 644 debs/*.deb
          sudo chown -R $(whoami):$(whoami) debs/
      - name: Generate Packages
        run: |
          dpkg-scanpackages --multiversion debs /dev/null > Packages.raw
          sed -E 's/^Section:.*$/Section: Tweaks/' Packages.raw > Packages
          zstd -f Packages -o Packages.zst
          rm -f Packages.raw
      - name: Generate Release
        run: |
          cat > Release <<EOF
Origin: XY
Label: XY
Suite: stable
Codename: stable
Version: 1.0
Architectures: iphoneos-arm64 iphoneos-arm64e
Components: main
Description: XY
Icon: CydiaIcon.png
EOF
          apt-ftparchive release . >> Release
      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add Packages Packages.zst Release
          git commit -m "Auto-update: All to Tweaks + rebuild Release" || echo "No changes to commit"
          git push origin master
