name: Update Repo Packages
on:
  push:
    paths:
      - 'debs/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev zstd fakeroot

      - name: Repair deb (清理Mac xattr + 修复control权限)
        run: |
          for deb in debs/*.deb; do
            if [ -f "$deb" ]; then
              tmp=$(mktemp -d)
              # 解压deb
              fakeroot dpkg-deb -R "$deb" "$tmp"
              # 强制修复DEBIAN目录和control权限
              chmod 755 "$tmp/DEBIAN"
              chmod 644 "$tmp/DEBIAN/control"
              # 重新打包成干净deb，清除苹果扩展属性
              fakeroot dpkg-deb -b "$tmp" "$deb"
              rm -rf "$tmp"
            fi
          done

      - name: Generate Packages
        run: |
          fakeroot dpkg-scanpackages --multiversion debs /dev/null > Packages.raw
          sed -E 's/^Section:.*$/Section: Tweaks/' Packages.raw > Packages
          zstd -f Packages -o Packages.zst
          rm -f Packages.raw

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add Packages Packages.zst
          git commit -m "Auto-update: All to Tweaks" || echo "No changes"
          git push -f origin master
