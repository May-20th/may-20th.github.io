name: Update Repo Packages
on:
  push:
    paths:
      - 'debs/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev zstd fakeroot

      - name: Get changed deb files
        id: getchanged
        run: |
          # 获取本次提交新增/修改的deb
          CHANGED_DEBS=$(git diff --name-only HEAD^ HEAD | grep '^debs/.*\.deb$' || true)
          echo "changed_debs<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_DEBS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_DEBS"

      - name: Repair only changed deb
        if: steps.getchanged.outputs.changed_debs != ''
        run: |
          for deb in ${{ steps.getchanged.outputs.changed_debs }}; do
            if [ -f "$deb" ]; then
              tmp=$(mktemp -d)
              fakeroot dpkg-deb -R "$deb" "$tmp"
              chmod 755 "$tmp/DEBIAN"
              chmod 644 "$tmp/DEBIAN/control"
              [ -f "$tmp/DEBIAN/preinst" ] && chmod 755 "$tmp/DEBIAN/preinst"
              [ -f "$tmp/DEBIAN/postinst" ] && chmod 755 "$tmp/DEBIAN/postinst"
              [ -f "$tmp/DEBIAN/prerm" ] && chmod 755 "$tmp/DEBIAN/prerm"
              [ -f "$tmp/DEBIAN/postrm" ] && chmod 755 "$tmp/DEBIAN/postrm"
              fakeroot dpkg-deb -b "$tmp" "$deb"
              rm -rf "$tmp"
            fi
          done

      - name: Generate Packages
        run: |
          fakeroot dpkg-scanpackages --multiversion debs /dev/null > Packages.raw
          sed -E 's/^Section:.*$/Section: Tweaks/' Packages.raw > Packages
          zstd -f Packages -o Packages.zst
          rm -f Packages.raw

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add Packages Packages.zst
          git commit -m "Auto-update: All to Tweaks" || echo "No changes to commit"
          git push origin master || echo "Push conflict, skip, other job occupied branch"